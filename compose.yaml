# Cyrilingo stack. For now only the database, used in development and by the tests
# (`docker compose up db`); the migrate, api and web services come with the deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cyrilingo
      POSTGRES_DB: cyrilingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only: reachable from this machine (npm run dev, tests), never from the network.
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cyrilingo -d cyrilingo]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
