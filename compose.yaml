# The Cyrilingo stack (SPEC.md › Deployment). Settings come from .env or from the host's
# environment variables (template in .env.example); no value is ever written here.
#
# Development: `docker compose up db`, then `npm run dev`.
# Full stack:  `docker compose up --build`, then open PUBLIC_URL (http://localhost:8080 locally).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyrilingo
      POSTGRES_DB: cyrilingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only: reachable from this machine (npm run dev, tests), never from the network.
    # The other services reach it as db:5432 on the stack's own network.
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cyrilingo -d cyrilingo]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the pending migrations and the seed at each start, then serves (apps/api/Dockerfile).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      DATABASE_URL: postgres://cyrilingo:${POSTGRES_PASSWORD}@db:5432/cyrilingo
      # Fixed inside the stack: web forwards to api:3000. API_PORT in .env is for `npm run dev`.
      API_PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      SPEECH_DAILY_LIMIT: ${SPEECH_DAILY_LIMIT:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 200 only when the database answers too.
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      # Room for the migrations, which run before the server listens.
      start_period: 30s
      retries: 5

  # The only published port. Put the HTTPS reverse proxy in front of it.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-8080}:80
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
