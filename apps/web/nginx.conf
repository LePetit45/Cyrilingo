# Nginx of the `web` service (SPEC.md › Deployment): serves the static front end and forwards
# /api and /mcp to the api service. HTTPS is the job of the reverse proxy in front of it.

# Pass on the scheme the outer reverse proxy saw, or ours when there is none.
map $http_x_forwarded_proto $forwarded_proto {
	default $http_x_forwarded_proto;
	'' $scheme;
}

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	server_tokens off;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	gzip on;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

	# The API checks its exact limits (16 KB of JSON, 200 KB for a recording); this only stops
	# anything far bigger before it reaches it.
	client_max_body_size 256k;

	location /api/ {
		proxy_pass http://api:3000;
		proxy_set_header Host $host;
		# The API reads the learner's IP from the first entry (TRUST_PROXY=true): keep the one the
		# outer proxy put there and add ours after it.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $forwarded_proto;
	}

	location = /mcp {
		proxy_pass http://api:3000;
		proxy_set_header Host $host;
		# The API reads the learner's IP from the first entry (TRUST_PROXY=true): keep the one the
		# outer proxy put there and add ours after it.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $forwarded_proto;
	}

	# Content-hashed files never change: cache them for a year.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}

	# Not in Nginx's mime.types: without it, browsers get application/octet-stream.
	location = /manifest.webmanifest {
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options nosniff always;
	}

	# Pages are prerendered as /alphabet.html and so on. HTML, the service worker and the rest
	# are checked again on every load, so a deploy reaches the PWA at once.
	location / {
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		try_files $uri $uri.html $uri/index.html =404;
	}
}
